#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:radial-gradient(700px 400px at 20% 0,rgba(44,92,230,.5),transparent 60%),var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.hero h2{font-size:34px;margin:0;letter-spacing:-.02em}.hero p{margin:0;color:#aebbdc;font-size:16px}
.fw{display:grid;place-items:center;padding:24px}
.lc{width:100%;max-width:380px}.lc h1{font-size:26px;margin:14px 0 2px}.lc .sub{color:var(--mut);margin:0 0 8px}
.roles{display:grid;gap:8px;margin-top:6px}
.roles label{display:flex;align-items:center;gap:10px;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px;cursor:pointer}
.roles input{width:auto}
.lk{display:flex;justify-content:space-between;margin-top:14px;color:var(--pri);font-size:13px}
@media(max-width:860px){#login{grid-template-columns:1fr}.hero{display:none}}
/* shell */
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--navy);color:#b9c6e6;padding:18px 12px;position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:20px;padding:0 8px 18px}
.side button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;padding:11px 12px;border-radius:8px;cursor:pointer;font-weight:500;text-align:left;margin-bottom:2px}
.side button:hover{background:rgba(255,255,255,.06)}
.side button.on{background:var(--pri);color:#fff}
.mn{flex:1;min-width:0}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 20px}
.tb input{max-width:440px;background:var(--bg)}
.sp{flex:1}.burger{display:none;background:none;border:0;padding:4px;cursor:pointer}
.av{display:flex;align-items:center;gap:10px;font-weight:600}
.av span{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:700}
.sc{position:fixed;inset:0;background:rgba(3,8,22,.5);z-index:44}
@media(max-width:860px){.side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:50;padding-top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}.burger{display:block}.av b{display:none}}
main{padding:20px;max-width:1100px}
h1.pt{font-size:20px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.card h2{font-size:15px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:12px}
.ib{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);flex:none}
.stat small{color:var(--mut);display:block}.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}main{padding:14px}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}tr[onclick]{cursor:pointer}tr[onclick]:hover{background:var(--bg)}
.b{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.s0{--c:#64748b}.s1{--c:#d97706}.s2{--c:#2c5ce6}.s3{--c:#16a34a}.s4{--c:#0d9488}
.bar{display:flex;gap:10px;margin-bottom:12px;align-items:center}.bar input{max-width:380px}
.sum{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.sum:last-child{border:0}
.ov{position:fixed;inset:0;background:rgba(3,8,22,.55);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:16px}}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.row span:first-child{color:var(--mut)}
.tl{list-style:none;padding:0;margin:14px 0}
.tl li{display:flex;gap:12px;padding-bottom:14px;position:relative;color:var(--mut)}
.tl li::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}.tl li:last-child::before{display:none}
.tl i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;background:var(--card)}
.tl li.d{color:var(--ink)}.tl li.d i{background:var(--pri);border-color:var(--pri)}
.tl small{display:block;color:var(--mut)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.low{color:var(--bad);font-weight:600}
.inv{max-width:460px}.inv .hd{display:flex;justify-content:space-between;margin-bottom:12px}
.pay{display:inline-block;background:color-mix(in srgb,#16a34a 15%,transparent);color:#16a34a;font-weight:700;padding:2px 8px;border-radius:6px}
.pay.due{background:color-mix(in srgb,#d97706 15%,transparent);color:#d97706}
.hb{display:flex;align-items:center;gap:10px;margin:8px 0}.hb div{height:10px;border-radius:6px;background:var(--c)}
.nt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.nt:last-child{border:0}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:absolute;left:0;top:0;width:100%}}
.s5{--c:#dc2626}.nt small{display:block;color:var(--mut)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{background:none;border:0;padding:8px 2px;color:var(--mut);font-weight:600;cursor:pointer;border-bottom:2px solid transparent}.tabs .on{color:var(--pri);border-color:var(--pri)}
.wc{display:flex;justify-content:space-between;gap:12px;align-items:center}
.pg{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}.pg button{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer}.pg .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.donut{width:120px;height:120px;border-radius:50%;background:conic-gradient(#2c5ce6 0 62%,#16a34a 62% 86%,#f59e0b 86% 100%);display:grid;place-items:center;flex:none}.donut::after{content:"";width:72px;height:72px;border-radius:50%;background:var(--card)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.sm{display:grid;grid-template-columns:210px 1fr;gap:16px}
@media(max-width:860px){.cols,.sm{grid-template-columns:1fr}}
.sl button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:8px;color:var(--ink);cursor:pointer}.sl .on{background:var(--soft);color:var(--pri);font-weight:600}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>')</script>

<body>
<section id="login">
  <div class="hero"><span class="logo">SM</span><h2>SmBiz</h2><p>Smart system for modern mobile shops.<br>Manage. Repair. Grow.</p></div>
  <div class="fw"><div class="lc">
    <span class="logo">SM</span><h1>SmBiz</h1><p class="sub">Mobile Repair Management</p>
    <label>Email or phone</label><input placeholder="Email or Phone">
    <label>Password</label><input type="password" placeholder="Password">
    <label>Select role</label>
    <div class="roles"><label><input type="radio" name="rl" value="Owner" checked> Owner</label><label><input type="radio" name="rl" value="Manager"> Manager</label><label><input type="radio" name="rl" value="Technician"> Technician</label></div>
    <button class="btn n" style="width:100%;margin-top:16px" onclick="doLogin()">Login</button>
    <div class="lk"><span>Forgot password?</span><span>Create account</span></div>
    <p class="sub" style="margin-top:14px;font-size:12px">Demo: log in with any details.</p>
  </div></div>
</section>

<section id="app" class="app" hidden>
  <aside class="side" id="side"><div class="brand"><span class="logo">SM</span>SmBiz</div><div id="menu"></div></aside>
  <div class="mn">
    <div class="tb"><button class="burger" onclick="tog()" aria-label="Menu"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <input id="gs" placeholder="Search customer, device, IMEI, job ID" oninput="gsearch()"><span class="sp"></span>
      <div class="av"><span id="ini">O</span><b id="who">Owner</b></div></div>
    <main id="view"></main>
  </div>
</section>
<div class="ov" id="m" hidden onclick="if(event.target===this)closeM()"><div class="sheet" id="sh"></div></div>
<div class="sc" id="sc" hidden onclick="tog()"></div>

<script>
const ST=["Received","Checking","Repairing","Ready","Delivered"],TECH=["Ameen","Shan","Fahad"];
const IC={dash:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
cus:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',rep:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',
stock:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',pur:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/>',
sup:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',bill:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
rpt:'<path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6"/>',not:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
chk:'<path d="M5 12l5 5 9-10"/>',clk:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ic=k=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
const NAV=[["dash","Dashboard"],["cus","Customers"],["rep","Repairs"],["stock","Stock"],["pur","Purchase"],["sup","Suppliers"],["bill","Billing"],["rpt","Reports"],["not","Notifications"],["set","Settings"]];
const ALLOW={Owner:null,Manager:["dash","cus","rep","stock","pur","sup","bill","rpt","not"],Technician:["dash","rep","stock","not"]};
const seedR=[
{id:"SMB-000245",c:"Riyas",p:"9876543210",d:"iPhone 13",imei:"359876543210987",issue:"Touch not working",t:"Ameen",s:"Repairing",amt:4500,date:"12 Sep 2025",log:{Received:"12 Sep, 10:15 AM",Checking:"12 Sep, 12:30 PM",Repairing:"12 Sep, 03:45 PM"}},
{id:"SMB-000244",c:"Fathima",p:"8123456789",d:"Samsung A37",imei:"352110987654321",issue:"Battery drains fast",t:"Shan",s:"Checking",amt:1800,date:"12 Sep 2025",log:{Received:"12 Sep, 09:40 AM",Checking:"12 Sep, 11:20 AM"}},
{id:"SMB-000243",c:"Najeeb",p:"9401234567",d:"Redmi 9A",imei:"866554433221100",issue:"Charging port loose",t:"Fahad",s:"Received",amt:750,date:"11 Sep 2025",log:{Received:"11 Sep, 05:10 PM"}},
{id:"SMB-000242",c:"Afsal",p:"9654321890",d:"iPhone 12",imei:"356789012345678",issue:"Cracked display",t:"Shan",s:"Ready",amt:5200,date:"11 Sep 2025",log:{Received:"11 Sep, 10:00 AM",Checking:"11 Sep, 11:00 AM",Repairing:"11 Sep, 12:10 PM",Ready:"11 Sep, 04:30 PM"}},
{id:"SMB-000241",c:"Shahana",p:"7901234567",d:"Vivo V40",imei:"860123456789012",issue:"Camera blurry",t:"Ameen",s:"Delivered",amt:2200,date:"10 Sep 2025",log:{Received:"10 Sep, 10:00 AM",Delivered:"11 Sep, 01:00 PM"}}];
const seedK=[{n:"Display",m:"iPhone 13",q:5,pr:4500},{n:"Battery",m:"iPhone 13",q:8,pr:1800},{n:"Charging Port",m:"Samsung A37",q:12,pr:750},{n:"Camera",m:"iPhone 12",q:4,pr:2200},{n:"Flex Cable",m:"Redmi 9A",q:15,pr:350},{n:"Back Cover",m:"Vivo V40",q:6,pr:600}];
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem("smbiz3."+k));if(Array.isArray(v)&&v.length)return v}catch(e){}return d};
(function(){const nm=["Anoop","Basheer","Chandni","Dilshad","Ebin","Farhan","Gopika","Hari","Irfan","Jishnu","Kavya","Latheef","Midhun","Nisha","Ouseph","Praveen","Rasheed","Sana","Thasni","Unais","Vishnu","Yasir","Zahra"],dv=["iPhone 11","Samsung M14","Redmi Note 11","Realme 9","Oppo A57","Vivo Y22","OnePlus Nord","Poco X4"],is=["Display broken","Battery swelling","Speaker issue","Water damage","Charging slow","Software update","Mic not working"];
const sts=[].concat(Array(24).fill("Delivered"),Array(7).fill("Ready"),Array(9).fill("Repairing"),Array(3).fill("Cancelled"));
sts.forEach((s,i)=>{const n=239-i,d=Math.max(1,10-Math.floor(i/6));seedR.push({id:"SMB-"+String(n).padStart(6,"0"),c:nm[i%nm.length],p:"9"+String(600000000+(i%nm.length)*7919341).slice(0,9),d:dv[i%dv.length],imei:"35"+String(1e13+i*98765431).slice(0,13),issue:is[i%is.length],t:TECH[i%3],s,amt:500+((i*377)%48)*100,date:d+" Sep 2025",log:{Received:d+" Sep, 10:00 AM"}})})})();
let R=[],K=[],page="dash",role="Owner";
const save=()=>{};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const nowS=()=>new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const bd=s=>`<span class="b s${ST.indexOf(s)<0?5:ST.indexOf(s)}">${s}</span>`;
const cnt=f=>R.filter(f).length;

function doLogin(){const r=document.querySelector("input[name=rl]:checked");role=r?r.value:"Owner";$("#who").textContent=role;$("#ini").textContent=role[0];
  const a=ALLOW[role];$("#menu").innerHTML=NAV.filter(n=>!a||a.includes(n[0])).map(n=>`<button data-p="${n[0]}" onclick="go('${n[0]}')">${ic(n[0])}${n[1]}</button>`).join("");
  $("#login").hidden=true;$("#app").hidden=false;go("dash")}
function tog(){const o=$("#side").classList.toggle("open");$("#sc").hidden=!o}
function go(p){page=p;$("#side").classList.remove("open");$("#sc").hidden=true;document.querySelectorAll("#menu button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));$("#gs").value="";render();window.scrollTo(0,0)}

const head="<tr><th>Job ID</th><th>Customer</th><th>Device</th><th>Status</th><th>Technician</th><th>Date</th></tr>";
const rows=l=>l.map(r=>`<tr onclick="openJob('${r.id}')"><td>${r.id}</td><td>${esc(r.c)}</td><td>${esc(r.d)}</td><td>${bd(r.s)}</td><td>${esc(r.t)}</td><td>${r.date}</td></tr>`).join("")||`<tr><td colspan="6" style="color:var(--mut)">No repairs found.</td></tr>`;
const stat=(k,l,v,c)=>`<div class="card stat"><span class="ib" style="--c:${c}">${ic(k)}</span><div><small>${l}</small><b>${v}</b></div></div>`;

function chart(){
  const days=[],d=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);days.push(x.toLocaleDateString("en-GB",{weekday:"short"}));d.push(R.filter(r=>new Date(r.ts).toDateString()===x.toDateString()).length)}const mx=Math.max(4,...d),P=d.map((v,i)=>[14+i*52,130-v/mx*110]);
  const ln=P.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  return `<svg viewBox="0 0 340 160" width="100%" role="img" aria-label="Repairs this week"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c5ce6" stop-opacity=".25"/><stop offset="1" stop-color="#2c5ce6" stop-opacity="0"/></linearGradient></defs>
  <path d="${ln} L${P[6][0]} 135 L14 135Z" fill="url(#gr)"/><path d="${ln}" fill="none" stroke="#2c5ce6" stroke-width="2.5" stroke-linejoin="round"/>
  ${P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#2c5ce6"/>`).join("")}
  ${days.map((t,i)=>`<text x="${14+i*52}" y="154" text-anchor="middle" font-size="10" fill="#6b7794">${t}</text>`).join("")}</svg>`;
}
function render(){
  const v=$("#view"),T=t=>`<h1 class="pt">${t}</h1>`;
  if(page==="dash"){
    v.innerHTML=T("Dashboard")+`<div class="grid">${stat("rep","Total repairs",R.length,"#2c5ce6")}${stat("clk","In progress",cnt(r=>["Received","Checking","Repairing"].includes(r.s)),"#d97706")}${stat("chk","Ready for pickup",cnt(r=>r.s==="Ready"),"#16a34a")}${stat("chk","Completed",cnt(r=>r.s==="Delivered"),"#0d9488")}</div>
    <div class="two"><div class="card"><h2>Repair overview</h2>${chart()}</div>
    <div class="card"><h2>Today’s summary</h2><div class="sum"><span>New repairs</span><b>${cnt(r=>r.s==="Received")}</b></div><div class="sum"><span>Completed</span><b>${cnt(r=>r.s==="Delivered")}</b></div><div class="sum"><span>Pending</span><b>${cnt(r=>["Checking","Repairing"].includes(r.s))}</b></div></div></div>
    <div class="card"><h2>Recent repairs</h2><div class="tw"><table><thead>${head}</thead><tbody>${rows(R.slice(0,6))}</tbody></table></div></div>`;
  }else if(page==="rep"){
    v.innerHTML=T("Repairs")+`<div class="bar"><input id="sq" placeholder="Search name, phone, device, IMEI, job ID" oninput="filt()"><button class="btn" onclick="newJob()">New repair</button></div><div class="card"><div class="tw"><table><thead>${head}</thead><tbody id="tb">${rows(R)}</tbody></table></div></div>`;
  }else if(page==="cus"){
    const m={};R.forEach(r=>{const k=r.p||r.c;(m[k]=m[k]||{c:r.c,p:r.p,n:0,d:new Set()}).n++;m[k].d.add(r.d)});
    v.innerHTML=T("Customers")+`<div class="bar"><span class="sp"></span><button class="btn" onclick="newJob()">Add customer</button></div><div class="card"><div class="tw"><table><thead><tr><th>Name</th><th>Phone</th><th>Device</th><th>Total repairs</th></tr></thead><tbody>${Object.values(m).map(x=>`<tr><td>${esc(x.c)}</td><td>${esc(x.p)}</td><td>${esc([...x.d].join(", "))}</td><td>${x.n}</td></tr>`).join("")}</tbody></table></div></div>`;
  }else if(page==="stock"){
    v.innerHTML=T("Stock inventory")+`<div class="bar"><span class="sp"></span><button class="btn" onclick="newStock()">Add stock</button></div><div class="card"><div class="tw"><table><thead><tr><th>Part name</th><th>Model</th><th>Qty</th><th>Price</th></tr></thead><tbody>${K.map(k=>`<tr><td>${esc(k.n)}</td><td>${esc(k.m)}</td><td class="${k.q<=3?"low":""}">${k.q}${k.q<=3?" (low)":""}</td><td>${inr(k.pr)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }else if(page==="bill"){
    const id=window.bj||R[0].id,r=R.find(x=>x.id===id)||R[0],paid=r.s==="Delivered";
    v.innerHTML=T("Billing and printing")+`<label style="margin:0 0 6px">Select job</label><select id="bsel" onchange="window.bj=this.value;render()" style="max-width:340px;margin-bottom:14px">${R.map(x=>`<option value="${x.id}" ${x.id===r.id?"selected":""}>${x.id} · ${esc(x.c)}</option>`).join("")}</select>
    <div class="card inv" id="inv"><div class="hd"><div><b style="font-size:17px">SmBiz</b><br><span style="color:var(--mut)">Mobile repair shop</span></div><div style="text-align:right"><b>INV-${r.id.slice(4)}</b><br><span style="color:var(--mut)">${r.date}</span></div></div>

  const {data,error}=await sb.from("stock").insert({shop_id:SHOP,part:n,model:$("#k_m").value.trim(),qty:Number($("#k_q").value)||0,price:Number($("#k_p").value)||0}).select().single();
  if(error)return fail(error);K.push(mapK(data));closeM();render()}

V.rpt=()=>{const rev=R.filter(r=>r.s==="Delivered").reduce((a,r)=>a+r.amt,0),mx=Math.max(1,...ST.map(s=>cnt(r=>r.s===s)));
  return H("Reports and analytics")+`<div class="grid">${stat("bill","Revenue (delivered)",inr(rev),"#16a34a")}${stat("rep","Repairs",R.length,"#2c5ce6")}${stat("rpt","Average bill",inr(R.length?Math.round(R.reduce((a,r)=>a+r.amt,0)/R.length):0),"#7c3aed")}</div>
  <div class="card"><h2>Repairs by status</h2>${ST.map((s,i)=>`<div class="hb"><span style="width:84px">${s}</span><div class="s${i}" style="width:${Math.round(cnt(r=>r.s===s)/mx*100)}%;min-width:6px"></div><b>${cnt(r=>r.s===s)}</b></div>`).join("")}</div>`};
V.not=()=>{const L=[...K.filter(k=>k.q<=3).map(k=>["not","#dc2626","Low stock alert",`${esc(k.n)} (${esc(k.m)}): only ${k.q} left`]),...R.filter(r=>r.s==="Ready").map(r=>["chk","#16a34a","Repair ready",`${r.id} is ready for pickup`])];
  return H("Notifications and alerts")+`<div class="card">${L.map(x=>`<div class="nt"><span class="ib" style="--c:${x[1]}">${ic(x[0])}</span><div><b>${x[2]}</b><small>${x[3]}</small></div></div>`).join("")||"No alerts right now."}</div>`};

authUI();
sb.auth.getSession().then(({data})=>{if(data.session)boot()});
</script>
